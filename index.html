<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Munsell Rolodex</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
    /* Reset margin and padding for all elements */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    /* Ensure the body takes up the full viewport */
    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    .viewer-hint {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1;
        padding: 14px 16px;
        text-align: center;
        color: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.3;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        pointer-events: none;
    }
    </style>
</head>
<body>
    <div id="app"></div>
    <p class="viewer-hint">Drag mouse to explore the normalized Munsell color space</p>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
